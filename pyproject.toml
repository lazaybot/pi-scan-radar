[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pi-scan-radar"
version = "0.1.0"
description = "Portable Raspberry Pi scanning rangefinder with simulation and hardware modes"
requires-python = ">=3.9"
license = "BSD-3-Clause"
authors = [{name = "Jaden LyTran"}]
dependencies = []

[project.optional-dependencies]
hardware = ["adafruit-circuitpython-vl53l1x>=1.2", "adafruit-circuitpython-pca9685>=3.4", "adafruit-circuitpython-motor>=3.4"]
plot = ["matplotlib>=3.7"]
dev = ["pytest>=7"]

[project.scripts]
pi-scan-radar = "pi_scan_radar.cli:main"
pi-scan-radar-plot = "pi_scan_radar.plot:main"

[tool.setuptools.packages.find]
include = ["pi_scan_radar*"]
